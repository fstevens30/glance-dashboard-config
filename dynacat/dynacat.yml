server:
  port: 8090
  assets-path: /app/assets

theme:
  background-color: 240 8 9
  primary-color: 0 0 100
  positive-color: 100 75 62
  negative-color: 355 72 60
  contrast-multiplier: .9
  disable-picker: true

branding:
  logo-url: https://raw.githubusercontent.com/fstevens30/glance-dashboard-config/main/dynacat/logo.png
  favicon-url: https://raw.githubusercontent.com/fstevens30/glance-dashboard-config/main/dynacat/logo.png
  app-name: "Dashboard"
  app-icon-url: https://raw.githubusercontent.com/fstevens30/glance-dashboard-config/main/dynacat/logo.png
  app-background-color: "#151519"
  hide-footer: true

pages:
  - name: Home
    width: wide
    hide-desktop-navigation: true
    columns:
      # Sidebar, these are externally accessible links that I use frequently.
      - size: small
        widgets:
          - type: bookmarks
            title: Bookmarks
            hide-header: true
            groups:
              - title: Productivity
                color: 47 100 50
                links:
                  - title: Gmail
                    url: ${MAIL_URL}
                    icon: mdi:email-outline
                  - title: iCloud
                    url: ${CLOUD_URL}
                    icon: mdi:cloud-outline
                  - title: Budget
                    url: ${BUDGET_URL}
                    icon: mdi:cash-multiple
                  - title: Banking
                    url: ${BANKING_URL}
                    icon: mdi:bank
                  - title: ChatGPT
                    url: https://chat.openai.com/
                    icon: mdi:robot-outline
                  - title: GitHub
                    url: https://github.com/
                    icon: mdi:file-code-outline
                  - title: Home
                    url: ${HOME_URL}
                    icon: mdi:home-lightning-bolt-outline
                  - title: Health
                    url: ${HEALTH_URL}
                    icon: mdi:heart-circle-outline

              - title: Media
                color: 273 100 50
                links:
                  - title: Jellyfin
                    url: ${JELLYFIN_URL}
                    icon: mdi:television-play
                  - title: Movies
                    url: ${RADARR_URL}
                    icon: mdi:movie-open-outline
                  - title: Shows
                    url: ${SONARR_URL}
                    icon: mdi:television-classic
                  - title: Torrents
                    url: ${TORRENT_URL}
                    icon: mdi:download-box-outline
                  - title: Requests
                    url: ${SEERR_URL}
                    icon: mdi:eye-outline
                  - title: Stats
                    url: ${JELLYSTAT_URL}
                    icon: mdi:clipboard-text-clock-outline
                    
              - title: Homelab
                color: 210 70 55
                links:
                  - title: Router
                    url: ${ROUTER_URL}
                    icon: mdi:router-wireless
                  - title: Domains
                    url: ${DOMAINS_URL}
                    icon: mdi:web
                  - title: DNS
                    url: ${DNS_URL}
                    icon: mdi:block-helper
                  - title: Monitor
                    url: ${STATUS_URL}
                    icon: mdi:monitor-dashboard
                  - title: Dockhand
                    url: ${PORTAINER_URL}
                    icon: mdi:train-car-container
                  - title: NAS
                    url: ${NAS_URL}
                    icon: mdi:nas
                  

      # Main content.
      - size: full
        widgets:
          - type: group
            title: News
            css-class: news-tabs
            hide-header: true
            widgets:
              - type: rss
                title: World News
                feeds:
                  - url: https://www.rnz.co.nz/rss/world.xml
                    title: RNZ World Headlines
                  - url: https://feeds.bbci.co.uk/news/world/rss.xml
                    title: BBC World News

              - type: rss
                title: Local News
                feeds:
                  - url: https://news.google.com/rss/search?q=Christchurch+Canterbury+New+Zealand&hl=en-NZ&gl=NZ&ceid=NZ%3Aen
                    title: Google News Christchurch
                  - url: https://www.rnz.co.nz/rss/national.xml
                    title: RNZ National News
                  - url: https://www.rnz.co.nz/rss/ldr.xml
                    title: RNZ Local Democracy Reporting

              - type: rss
                title: Technology
                feeds:
                  - url: https://feeds.arstechnica.com/arstechnica/index
                    title: Ars Technica
                  - url: https://www.theverge.com/rss/index.xml
                    title: The Verge
                  - url: https://www.apple.com/newsroom/rss-feed.rss
                    title: Apple Newsroom
                  - url: https://www.youtube.com/feeds/videos.xml?user=LinusTechTips
                    title: Linus Tech Tips
                  - url: https://www.engadget.com/rss.xml
                    title: Engadget

              - type: rss
                title: Local Sports
                feeds:
                  - url: https://www.rnz.co.nz/rss/sport.xml
                    title: RNZ Sport
                  - url: https://www.rnz.co.nz/rss/live-sport.xml
                    title: RNZ Live Sport

              - type: rss
                title: Football
                feeds:
                  - url: https://feeds.bbci.co.uk/sport/football/rss.xml
                    title: BBC Football
                  - url: https://www.theguardian.com/football/rss
                    title: The Guardian Football
                  - url: https://news.google.com/rss/search?q=%22New+Zealand+football%22+OR+%22All+Whites%22+OR+%22Wellington+Phoenix%22+OR+%22Auckland+FC%22&hl=en-NZ&gl=NZ&ceid=NZ%3Aen
                    title: NZ Football News
              
              - type: rss
                title: Gaming
                feeds:
                  - url: https://www.ign.com/rss/articles/feed
                    title: IGN
                  - url: https://majornelson.com/feed/
                    title: XBOX WIRE

              - type: rss
                title: Development
                feeds:
                  - url: https://developer.apple.com/news/rss/news.rss
                    title: Apple Developer News

          - type: split-column
            widgets:
              - type: releases
                hide-header: true
                repositories:
                  - sonarr/sonarr
                  - radarr/radarr
                  - jellyfin/jellyfin
                  - Panonim/dynacat
                  - goauthentik/authentik 
                  - seerr-team/seerr 
                  - Finsys/dockhand
                  - AprilNEA/OpenLogi
                  - alexjustesen/speedtest-tracker

              - type: latest-media
                title: Recently Added
                update-interval: 30m
                item-count: 12
                columns: 4
                small-column: true
                hide-header: true
                hosts:
                  - url: jellyfin:${JELLYFIN_URL}
                    token: ${JELLYFIN_API_KEY}


      - size: small
        widgets:
          - type: torrenting
            hide-header: true
            hosts:
              - url: ${TORRENT_URL_LOCAL}
                username: ${TORRENT_USER}
                password: ${TORRENT_PASS}

          - type: dynawidgets
            hide-header: true
            widget: uptime-kuma
            title: Uptime Kuma
            title-url: ${UPTIME_KUMA_URL}
            cache: 10m

          - type: server-stats
            hide-header: true
            servers:
              - type: local
                name: Server
                compact: true
              - type: remote
                name: NAS
                url: ${NAS_API_URL}
                compact: true
                hide-mountpoints-by-default: true
                mountpoints:
                  "/":
                    hide: false
              
          - type: custom-api
            cache: 30m
            title: Internet Speed
            hide-header: true
            url: ${SPEEDTEST_URL}/api/v1/results/latest
            headers:
              Authorization: Bearer ${SPEEDTEST_TRACKER_API_TOKEN}
              Accept: application/json
            subrequests:
              stats:
                url: ${SPEEDTEST_URL}/api/v1/stats
                headers:
                  Authorization: Bearer ${SPEEDTEST_TRACKER_API_TOKEN}
                  Accept: application/json
            options:
              showPercentageDiff: true
            template: |
              {{ $showPercentage := .Options.BoolOr "showPercentageDiff" true }}

              {{ $stats := .Subrequest "stats" }}
              <div class="flex justify-between text-center margin-block-3">
              <div>
                  {{ $downloadChange := percentChange (.JSON.Float "data.download_bits") ($stats.JSON.Float "data.download.avg_bits")
                  }}
                  {{ if $showPercentage }}
                  <div
                  class="size-small {{ if gt $downloadChange 0.0 }}color-positive{{ else if lt $downloadChange 0.0 }}color-negative{{ else }}color-primary{{ end }}"
                  style="display: inline-flex; align-items: center;">
                  {{ $downloadChange | printf "%+.1f%%" }}
                  {{ if gt $downloadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ else if lt $downloadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ end }}
                  </div>
                  {{ end }}
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.download_bits" | mul 0.000001 | printf "%.1f" }}</div>
                  <div class="size-h6">DOWNLOAD</div>
              </div>
              <div>
                  {{ $uploadChange := percentChange (.JSON.Float "data.upload_bits") ($stats.JSON.Float "data.upload.avg_bits") }}
                  {{ if $showPercentage }}
                  <div
                  class="size-small {{ if gt $uploadChange 0.0 }}color-positive{{ else if lt $uploadChange 0.0 }}color-negative{{ else }}color-primary{{ end }}"
                  style="display: inline-flex; align-items: center;">
                  {{ $uploadChange | printf "%+.1f%%" }}
                  {{ if gt $uploadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ else if lt $uploadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ end }}
                  </div>
                  {{ end }}
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.upload_bits" | mul 0.000001 | printf "%.1f" }}</div>
                  <div class="size-h6">UPLOAD</div>
              </div>
              <div>
                  {{ $pingChange := percentChange (.JSON.Float "data.ping") ($stats.JSON.Float "data.ping.avg") }}
                  {{ if $showPercentage }}
                  <div
                  class="size-small {{ if gt $pingChange 0.0 }}color-negative{{ else if lt $pingChange 0.0 }}color-positive{{ else }}color-primary{{ end }}"
                  style="display: inline-flex; align-items: center;">
                  {{ $pingChange | printf "%+.1f%%" }}
                  {{ if lt $pingChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ else if gt $pingChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ end }}
                  </div>
                  {{ end }}
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.ping" | printf "%.0f ms" }}</div>
                  <div class="size-h6">PING</div>
              </div>
              </div>
