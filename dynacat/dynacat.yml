server:
  port: 8090
  assets-path: /app/assets

theme:
  custom-css-file: /assets/custom.css
  background-color: 240 8 9
  primary-color: 0 0 100
  positive-color: 100 75 62
  negative-color: 355 72 60
  contrast-multiplier: .9
  disable-picker: true

branding:
  logo-url: https://raw.githubusercontent.com/fstevens30/glance-dashboard-config/main/dynacat/logo.png
  favicon-url: https://raw.githubusercontent.com/fstevens30/glance-dashboard-config/main/dynacat/logo.png
  app-name: "Glance"
  app-icon-url: https://raw.githubusercontent.com/fstevens30/glance-dashboard-config/main/dynacat/logo.png
  app-background-color: "#151519"
  hide-footer: true

pages:
  - name: Home
    width: wide
    hide-desktop-navigation: true
    columns:
      # Sidebar, these are externally accessible links that I use frequently.
      - size: small
        widgets:
          - type: bookmarks
            title: Bookmarks
            hide-header: true
            groups:
              - title: Productivity
                color: 210 70 55
                links:
                  - title: Gmail
                    url: ${MAIL_URL}
                    icon: sh:gmail
                  - title: iCloud
                    url: ${CLOUD_URL}
                    icon: sh:icloud
                  - title: Budget
                    url: ${BUDGET_URL}
                    icon: sh:actual-budget
                  - title: Banking
                    url: ${BANKING_URL}
                    icon: mdi:bank
                  - title: ChatGPT
                    url: https://chat.openai.com/
                    icon: sh:chatgpt
                  - title: GitHub
                    url: https://github.com/
                    icon: sh:github-light
                  - title: Home
                    url: ${HOME_URL}
                    icon: sh:home-assistant

              - title: Personal
                color: 160 55 50
                links:
                  - title: Youtube
                    url: https://www.youtube.com/
                    icon: sh:youtube
                  - title: Facebook
                    url: https://www.facebook.com/
                    icon: sh:facebook
                  - title: Twitter
                    url: https://twitter.com/home
                    icon: sh:twitter
                  - title: Reddit
                    url: https://www.reddit.com/
                    icon: sh:reddit
                  - title: BlueSky
                    url: https://bsky.app/
                    icon: sh:butterfly

              - title: Media
                color: 25 75 55
                links:
                  - title: Jellyfin
                    url: ${JELLYFIN_URL}
                    icon: sh:jellyfin
                  - title: Movies
                    url: ${RADARR_URL}
                    icon: sh:radarr
                  - title: Shows
                    url: ${SONARR_URL}
                    icon: sh:sonarr
                  - title: Torrents
                    url: ${TORRENT_URL}
                    icon: sh:qbittorrent
                  - title: Requests
                    url: ${SEERR_URL}
                    icon: sh:seerr
                  - title: Stats
                    url: ${JELLYSTAT_URL}
                    icon: sh:jellystat

      # Main content.
      - size: full
        widgets:
          - type: search
            title: Search
            search-engine: google
            hide-header: true

          - type: group
            title: News
            css-class: news-tabs
            hide-header: true
            widgets:
              - type: rss
                title: World News
                feeds:
                  - url: https://www.rnz.co.nz/rss/world.xml
                    title: RNZ World Headlines
                  - url: https://feeds.bbci.co.uk/news/world/rss.xml
                    title: BBC World News
              - type: rss
                title: Local News
                feeds:
                  - url: https://news.google.com/rss/search?q=Christchurch+Canterbury+New+Zealand&hl=en-NZ&gl=NZ&ceid=NZ%3Aen
                    title: Google News Christchurch
                  - url: https://www.rnz.co.nz/rss/national.xml
                    title: RNZ National News
                  - url: https://www.rnz.co.nz/rss/ldr.xml
                    title: RNZ Local Democracy Reporting

              - type: rss
                title: Technology
                feeds:
                  - url: https://news.ycombinator.com/rss
                    title: Hacker News
                  - url: https://feeds.arstechnica.com/arstechnica/index
                    title: Ars Technica
                  - url: https://www.theverge.com/rss/index.xml
                    title: The Verge
                  - url: https://lobste.rs/rss
                    title: Lobsters

              - type: rss
                title: Local Sports
                feeds:
                  - url: https://www.rnz.co.nz/rss/sport.xml
                    title: RNZ Sport
                  - url: https://www.rnz.co.nz/rss/live-sport.xml
                    title: RNZ Live Sport

              - type: rss
                title: Football
                feeds:
                  - url: https://feeds.bbci.co.uk/sport/football/rss.xml
                    title: BBC Football
                  - url: https://www.theguardian.com/football/rss
                    title: The Guardian Football
                  - url: https://news.google.com/rss/search?q=%22New+Zealand+football%22+OR+%22All+Whites%22+OR+%22Wellington+Phoenix%22+OR+%22Auckland+FC%22&hl=en-NZ&gl=NZ&ceid=NZ%3Aen
                    title: NZ Football News

          - type: split-column
            widgets:
              - type: calendar
                title: Calendar
                css-class: home-calendar
                hide-header: true

              - type: custom-api
                title: Trending
                css-class: trending-media
                hide-header: true
                title-url: ${SEERR_URL}/discover/trending # trending, movies, or tv
                url: ${SEERR_URL}/api/v1/discover/trending # trending, movies, or tv
                cache: 15m
                headers:
                  accept: "application/json"
                  x-api-key: ${SEERR_API_KEY}
                parameters:
                  language: "en" # this can be changed to other languages if desired
                  page: "1"
                options:
                  show-media-type: true # set to false to hide the "| TV" or "| Movie" suffix
                  show-media-desc: true # set to false to hide the media's summary
                template: |
                  {{ $showMediaType := .Options.BoolOr "show-media-type" true }}
                  {{ $showMediaDesc := .Options.BoolOr "show-media-desc" true }}

                  {{ if eq .Response.StatusCode 200 }}
                    {{ $items := .JSON.Array "results" }}
                    {{ if gt (len $items) 0 }}
                      <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
                      {{ range $items }}
                        <li class="flex items-start gap-10 thumbnail-container thumbnail-parent">
                          {{ $mediaType := .String "mediaType" }}
                          {{ $mediaTitle := "" }}
                          {{ $mediaTypeUpper := "" }}
                          {{ if eq $mediaType "movie" }} {{ $mediaTitle = .String "title" }} {{ $mediaTypeUpper = "Movie" }}{{ else }}{{ $mediaTitle = .String "name" }} {{ $mediaTypeUpper = "TV" }}{{ end }}
                          {{ $overseerrUrl := concat " ${SEERR_URL}" "/" $mediaType "/" ( .String "id" ) }}
                          {{ $tmdbUrl := concat "https://www.themoviedb.org" "/" $mediaType "/" ( .String "id" ) }}
                          <a href={{ $overseerrUrl }} target="_blank">
                          <img src={{ concat "https://image.tmdb.org/t/p/w300" (.String "posterPath") }} style="border-radius: 5px; min-width: 5rem; max-width: 5rem;" class="card">
                          </a>
                          <div class="flex-1" style="padding-right: 5px;">
                            <p class="color-positive size-h4 text-truncate-2-lines margin-top-5" title={{ $mediaTitle }}><a href={{ $overseerrUrl }} target="_blank">{{ $mediaTitle }}</p>
                            <p class="size-h4" title="TMDB Rating"><a href={{ $tmdbUrl }} target="_blank">TMDB: {{ mul (.Float "voteAverage") 10 | toInt }}% {{ if $showMediaType }}| {{ $mediaTypeUpper }}{{ end }}</a></p>
                            {{ if $showMediaDesc }}<p class="color-subdue size-h4 text-truncate-2-lines" title={{ .String "overview" }}>{{ .String "overview" }}</p>{{ end }}
                          </div>
                        </li>
                      {{ end }}
                      </ul>
                    {{ else }}
                      <details style="margin-top:0.5rem">
                        <summary> Raw JSON:</summary>
                        <pre stye="font-size:10px">
                    {{ (printf "%+v" .JSON) }}
                        </pre>
                      </details>
                    {{ end }}
                  {{ end }}

      - size: small
        widgets:
          - type: weather
            title: Weather
            hide-header: true
            location: ${WEATHER_LOCATION}
            units: metric
            hour-format: 24h
            hide-location: true

          - type: custom-api
            title: Month
            hide-header: true
            body-type: string
            skip-json-validation: true
            cache: 1s
            template: |
              {{ $localTime := now }}

              {{ $month := $localTime.Month }}
              {{ $dayOfMonth := $localTime.Day }}
              {{ $year := $localTime.Year }}

              {{ $secondsToday := add (mul $localTime.Hour 3600) (mul $localTime.Minute 60) | add $localTime.Second }}
              {{ $fractionOfDay := div $secondsToday 86400.0 }}

              {{ $daysInMonth := 31 }}
              {{ if eq $month 2 }}
                {{ $isLeapYear := or (eq (mod $year 400) 0) (and (eq (mod $year 4) 0) (ne (mod $year 100) 0)) }}
                {{ $daysInMonth = 28 }}
                {{ if $isLeapYear }}{{ $daysInMonth = 29 }}{{ end }}
              {{ else if or (eq $month 4) (eq $month 6) (eq $month 9) (eq $month 11) }}
                {{ $daysInMonth = 30 }}
              {{ end }}

              {{ $daysElapsed := add (sub $dayOfMonth 1) $fractionOfDay }}
              {{ $monthProgress := mul (div $daysElapsed $daysInMonth) 100.0 }}

              {{ $gradient := "" }}
              {{ if lt $monthProgress 10.0 }}
                {{ $gradient = "#FF4BA2" }}
              {{ else if lt $monthProgress 25.0 }}
                {{ $gradient = "#FFE100, #FF4BA2" }}
              {{ else if lt $monthProgress 50.0 }}
                {{ $gradient = "#FFE100, #FF7600, #FF4400" }}
              {{ else }}
                {{ $gradient = "#FFE100, #FF7600, #FF4400, #FF4BA2" }}
              {{ end }}

              <div style="font-family: sans-serif; text-align: center;">
                <div style="width: 100%; height: 12px; background: #23262F; border:1px solid gray; border-radius: 10px; overflow: hidden;">
                  <div style="
                    height: 100%;
                    width: {{ $monthProgress }}%;
                    background: linear-gradient(90deg, {{ $gradient }});
                  "></div>
                </div>
                <div class="size-h1" style="margin-top: 6px;">{{ printf "%.2f" $monthProgress }}% of the month has passed</div>
              </div>

          - type: custom-api
            title: Uptime Kuma
            title-url: ${MONITOR_URL}/status/${UPTIME_KUMA_STATUS_SLUG}
            cache: 1m
            url: ${MONITOR_URL}/api/status-page/${UPTIME_KUMA_STATUS_SLUG}
            subrequests:
              heartbeats:
                url: ${MONITOR_URL}/api/status-page/heartbeat/${UPTIME_KUMA_STATUS_SLUG}
            template: |
              {{ $heartbeats := .Subrequest "heartbeats" }}

              {{ if or (ne .Response.StatusCode 200) (ne $heartbeats.Response.StatusCode 200) }}
                <p class="color-negative">Unable to load Uptime Kuma</p>
              {{ else if eq (len (.JSON.Array "publicGroupList")) 0 }}
                <p class="color-subdue">No public monitors found</p>
              {{ else }}
                <ul class="list list-gap-8">
                  {{ range .JSON.Array "publicGroupList" }}
                    {{ range .Array "monitorList" }}
                      {{ $id := .String "id" }}
                      {{ $heartbeatPath := concat "heartbeatList." $id }}
                      {{ $uptimePath := concat "uptimeList." $id "_24" }}
                      {{ $heartbeatList := $heartbeats.JSON.Array $heartbeatPath }}
                      {{ $uptime := mul ($heartbeats.JSON.Float $uptimePath) 100 }}

                      <li class="flex items-center gap-10">
                        <a
                          class="grow text-truncate color-highlight"
                          href="${MONITOR_URL}/status/${UPTIME_KUMA_STATUS_SLUG}"
                          target="_blank"
                          rel="noreferrer"
                        >
                          {{ .String "name" }}
                        </a>

                        <span class="color-subdue size-h6">
                          {{ printf "%.2f%%" $uptime }}
                        </span>

                        {{ if gt (len $heartbeatList) 0 }}
                          {{ $latest := index $heartbeatList (sub (len $heartbeatList) 1) }}
                          {{ $status := $latest.Int "status" }}

                          {{ if eq $status 1 }}
                            <span class="color-positive size-h6">
                              {{ $latest.Int "ping" }}ms
                            </span>
                            <span
                              title="Operational"
                              style="width:9px;height:9px;border-radius:50%;background:var(--color-positive);flex-shrink:0;"
                            ></span>
                          {{ else if eq $status 3 }}
                            <span style="color:var(--dashboard-accent);" class="size-h6">
                              Maintenance
                            </span>
                            <span
                              title="Maintenance"
                              style="width:9px;height:9px;border-radius:50%;background:var(--dashboard-accent);flex-shrink:0;"
                            ></span>
                          {{ else }}
                            <span class="color-negative size-h6">Down</span>
                            <span
                              title="{{ $latest.String "msg" }}"
                              style="width:9px;height:9px;border-radius:50%;background:var(--color-negative);flex-shrink:0;"
                            ></span>
                          {{ end }}
                        {{ else }}
                          <span class="color-subdue size-h6">No data</span>
                          <span
                            title="No heartbeat data"
                            style="width:9px;height:9px;border-radius:50%;background:var(--color-text-subdue);flex-shrink:0;"
                          ></span>
                        {{ end }}
                      </li>
                    {{ end }}
                  {{ end }}
                </ul>
              {{ end }}

          - type: custom-api
            title: Storage
            css-class: sidebar-storage
            hide-header: true
            cache: 5m
            template: |
              {{ $baseURL := concat "${NAS_API_URL}" "/webapi/entry.cgi" }}

              {{ $auth := newRequest $baseURL
                  | withParameter "api" "SYNO.API.Auth"
                  | withParameter "version" "6"
                  | withParameter "method" "login"
                  | withParameter "account" "${NAS_USERNAME}"
                  | withParameter "passwd" "${NAS_PASSWORD}"
                  | withParameter "session" "FileStation"
                  | withParameter "format" "sid"
                  | getResponse
              }}

              {{ if and (eq $auth.Response.StatusCode 200) ($auth.JSON.Bool "success") }}
                {{ $sid := $auth.JSON.String "data.sid" }}

                {{ $storage := newRequest $baseURL
                    | withParameter "api" "SYNO.Core.System"
                    | withParameter "version" "1"
                    | withParameter "method" "info"
                    | withParameter "type" "storage"
                    | withParameter "_sid" $sid
                    | getResponse
                }}

                {{ $volumes := $storage.JSON.Array "data.vol_info" }}

                {{ if and
                    (eq $storage.Response.StatusCode 200)
                    ($storage.JSON.Bool "success")
                    (gt (len $volumes) 0)
                }}
                  {{ $volume := index $volumes 0 }}
                  {{ $total := $volume.Float "total_size" }}
                  {{ $used := $volume.Float "used_size" }}

                  {{ if gt $total 0.0 }}
                    {{ $usedPercent := mul (div $used $total) 100 }}
                    {{ $freePercent := sub 100 $usedPercent }}
                    {{ $usedTB := div $used 1099511627776 }}
                    {{ $totalTB := div $total 1099511627776 }}

                    <div style="width:100%;">
                      <div style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        margin-bottom:8px;
                        font-size:15px;
                        font-weight:600;
                      ">
                        <div>
                          <span style="color:var(--dashboard-accent);">USED</span>
                          <span style="color:var(--dashboard-accent);margin-left:5px;">
                            {{ $usedPercent | toInt }}%
                          </span>
                        </div>

                        <div>
                          <span>{{ $freePercent | toInt }}%</span>
                          <span class="color-subdue" style="margin-left:5px;">LEFT</span>
                        </div>
                      </div>

                      <div style="
                        width:100%;
                        height:14px;
                        border-radius:7px;
                        overflow:hidden;
                        position:relative;
                        background:rgba(255,255,255,.12);
                      ">
                        <div style="
                          width:{{ $usedPercent }}%;
                          height:100%;
                          background:var(--dashboard-accent);
                        "></div>

                        <div style="
                          position:absolute;
                          left:calc({{ $usedPercent }}% - 2px);
                          top:-2px;
                          width:4px;
                          height:18px;
                          background:#fff;
                          border-radius:4px;
                        "></div>
                      </div>

                      <div style="
                        display:flex;
                        justify-content:space-between;
                        margin-top:8px;
                        font-size:14px;
                        font-weight:500;
                      ">
                        <span class="color-subdue">
                          {{ printf "%.2f TB" $usedTB }}
                        </span>
                        <span class="color-subdue">
                          {{ printf "%.2f TB" $totalTB }}
                        </span>
                      </div>
                    </div>
                  {{ else }}
                    <p class="color-negative">Invalid storage capacity</p>
                  {{ end }}
                {{ else }}
                  <p class="color-negative">Failed to fetch storage data</p>
                {{ end }}

                {{ $logout := newRequest $baseURL
                    | withParameter "api" "SYNO.API.Auth"
                    | withParameter "version" "6"
                    | withParameter "method" "logout"
                    | withParameter "session" "FileStation"
                    | withParameter "_sid" $sid
                    | getResponse
                }}
              {{ else }}
                <p class="color-negative">
                  Synology authentication failed
                  {{ if $auth.JSON.Exists "error.code" }}
                    ({{ $auth.JSON.Int "error.code" }})
                  {{ end }}
                </p>
              {{ end }}

          - type: bookmarks
            title: Server
            hide-header: true
            css-class: sidebar-server
            groups:
              - title: ""
                color: 275 60 55
                links:
                  - title: NAS
                    url: ${NAS_URL}
                    icon: sh:synology

                  - title: Portainer
                    url: ${PORTAINER_URL}
                    icon: sh:portainer

          - type: custom-api
            cache: 1h
            title: Internet Speed
            css-class: sidebar-speed
            hide-header: true
            url: ${SPEEDTEST_URL}/api/v1/results/latest
            headers:
              Authorization: Bearer ${SPEEDTEST_TRACKER_API_TOKEN}
              Accept: application/json
            subrequests:
              stats:
                url: ${SPEEDTEST_URL}/api/v1/stats
                headers:
                  Authorization: Bearer ${SPEEDTEST_TRACKER_API_TOKEN}
                  Accept: application/json
            options:
              showPercentageDiff: true
            template: |
              {{ $showPercentage := .Options.BoolOr "showPercentageDiff" true }}

              {{ $stats := .Subrequest "stats" }}
              <div class="flex justify-between text-center margin-block-3">
              <div>
                  {{ $downloadChange := percentChange (.JSON.Float "data.download_bits") ($stats.JSON.Float "data.download.avg_bits")
                  }}
                  {{ if $showPercentage }}
                  <div
                  class="size-small {{ if gt $downloadChange 0.0 }}color-positive{{ else if lt $downloadChange 0.0 }}color-negative{{ else }}color-primary{{ end }}"
                  style="display: inline-flex; align-items: center;">
                  {{ $downloadChange | printf "%+.1f%%" }}
                  {{ if gt $downloadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ else if lt $downloadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ end }}
                  </div>
                  {{ end }}
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.download_bits" | mul 0.000001 | printf "%.1f" }}</div>
                  <div class="size-h6">DOWNLOAD</div>
              </div>
              <div>
                  {{ $uploadChange := percentChange (.JSON.Float "data.upload_bits") ($stats.JSON.Float "data.upload.avg_bits") }}
                  {{ if $showPercentage }}
                  <div
                  class="size-small {{ if gt $uploadChange 0.0 }}color-positive{{ else if lt $uploadChange 0.0 }}color-negative{{ else }}color-primary{{ end }}"
                  style="display: inline-flex; align-items: center;">
                  {{ $uploadChange | printf "%+.1f%%" }}
                  {{ if gt $uploadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ else if lt $uploadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ end }}
                  </div>
                  {{ end }}
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.upload_bits" | mul 0.000001 | printf "%.1f" }}</div>
                  <div class="size-h6">UPLOAD</div>
              </div>
              <div>
                  {{ $pingChange := percentChange (.JSON.Float "data.ping") ($stats.JSON.Float "data.ping.avg") }}
                  {{ if $showPercentage }}
                  <div
                  class="size-small {{ if gt $pingChange 0.0 }}color-negative{{ else if lt $pingChange 0.0 }}color-positive{{ else }}color-primary{{ end }}"
                  style="display: inline-flex; align-items: center;">
                  {{ $pingChange | printf "%+.1f%%" }}
                  {{ if lt $pingChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ else if gt $pingChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ end }}
                  </div>
                  {{ end }}
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.ping" | printf "%.0f ms" }}</div>
                  <div class="size-h6">PING</div>
              </div>
