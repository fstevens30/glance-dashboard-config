server:
  port: 8090 # Changed from 8080 to avoid clash with qBittorrent

theme:
  background-color: 240 10 8
  primary-color: 217 92 83
  contrast-multiplier: 1.2

pages:
  # ===========================================================================
  # PAGE 1 — HOME
  # Landing page: clock, weather, all-service health, quick links
  # ===========================================================================
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            title: Christchurch
            hour-format: 24h
            timezones:
              - timezone: Pacific/Auckland
                label: Local

          - type: weather
            title: Weather
            location: ${WEATHER_LOCATION}
            units: metric
            hour-format: 24h

          - type: bookmarks
            title: Quick Links
            groups:
              - title: Media
                color: 217 92 83
                links:
                  - title: Jellyfin
                    url: http://${HOST_IP}:8096
                    icon: si:jellyfin
                  - title: Jellyseerr
                    url: http://${HOST_IP}:5055
                    icon: si:jellyseerr

              - title: Downloads
                color: 200 70 55
                links:
                  - title: Radarr
                    url: http://${HOST_IP}:7878
                    icon: si:radarr
                  - title: Sonarr
                    url: http://${HOST_IP}:8989
                    icon: si:sonarr
                  - title: Prowlarr
                    url: http://${HOST_IP}:9696
                    icon: si:prowlarr
                  - title: qBittorrent
                    url: http://${HOST_IP}:8080
                    icon: si:qbittorrent

              - title: Network & System
                color: 190 75 55
                links:
                  - title: Pi-hole
                    url: http://${HOST_IP}/admin
                    icon: si:pihole
                  - title: Portainer
                    url: http://${HOST_IP}:9000
                    icon: si:portainer
                  - title: Synology DSM
                    url: http://${NAS_IP}:5000
                    icon: si:synology
                  - title: Cloudflare
                    url: https://one.dash.cloudflare.com
                    icon: si:cloudflare
                  - title: Speedtest Tracker
                    url: http://${HOST_IP}:8765
                    icon: si:speedtest

              - title: Home
                color: 145 70 55
                links:
                  - title: Home Assistant
                    url: http://${HOST_IP}:8123
                    icon: si:homeassistant
                  - title: Scrypted
                    url: http://${HOST_IP}:10443
                    icon: di:scrypted

      - size: full
        widgets:
          - type: monitor
            title: Service Health
            sites:
              - title: Jellyfin
                url: http://${HOST_IP}:8096
                icon: si:jellyfin
              - title: Jellyseerr
                url: http://${HOST_IP}:5055
                icon: si:jellyseerr
              - title: Radarr
                url: http://${HOST_IP}:7878
                icon: si:radarr
              - title: Sonarr
                url: http://${HOST_IP}:8989
                icon: si:sonarr
              - title: Prowlarr
                url: http://${HOST_IP}:9696
                icon: si:prowlarr
              - title: qBittorrent
                url: http://${HOST_IP}:8080
                icon: si:qbittorrent
              - title: Pi-hole
                url: http://${HOST_IP}/admin
                icon: si:pihole
              - title: Cloudflared
                url: http://${HOST_IP}:14001
                icon: si:cloudflare
              - title: Flaresolverr
                url: http://${HOST_IP}:8191
                icon: di:flaresolverr
              - title: Portainer
                url: http://${HOST_IP}:9000
                icon: si:portainer
              - title: Home Assistant
                url: http://${HOST_IP}:8123
                icon: si:homeassistant
              - title: Scrypted
                url: http://${HOST_IP}:10443
                icon: di:scrypted
              - title: Synology DSM
                url: http://${NAS_IP}:5000
                icon: si:synology
              - title: Speedtest Tracker
                url: http://${HOST_IP}:8765
                icon: si:speedtest

  # ===========================================================================
  # PAGE 2 — MEDIA
  # Jellyfin · Jellyseerr · Radarr · Sonarr · Prowlarr · qBittorrent
  # ===========================================================================
  - name: Media
    columns:
      - size: small
        widgets:
          - type: bookmarks
            title: Media Apps
            groups:
              - title: Watch
                color: 217 92 83
                links:
                  - title: Jellyfin
                    url: http://${HOST_IP}:8096
                    icon: si:jellyfin
                  - title: Jellyseerr
                    url: http://${HOST_IP}:5055
                    icon: si:jellyseerr

              - title: Acquire
                color: 200 70 55
                links:
                  - title: Radarr
                    url: http://${HOST_IP}:7878
                    icon: si:radarr
                  - title: Sonarr
                    url: http://${HOST_IP}:8989
                    icon: si:sonarr
                  - title: Prowlarr
                    url: http://${HOST_IP}:9696
                    icon: si:prowlarr
                  - title: qBittorrent
                    url: http://${HOST_IP}:8080
                    icon: si:qbittorrent

          - type: videos
            title: YouTube
            channels:
              - UCmlzNHg8QiWVutUyFOV2UdQ # TheStockPot
              - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling

      - size: full
        widgets:
          - type: releases
            title: Upcoming — Movies & TV
            show-days: 14
            sources:
              - url: http://${HOST_IP}:7878
                token: ${RADARR_API_KEY}
                type: radarr
              - url: http://${HOST_IP}:8989
                token: ${SONARR_API_KEY}
                type: sonarr

      - size: small
        widgets:
          - type: rss
            title: r/selfhosted
            limit: 6
            feeds:
              - url: https://www.reddit.com/r/selfhosted/.rss
                title: r/selfhosted
              - url: https://www.reddit.com/r/homelab/.rss
                title: r/homelab

          - type: rss
            title: Self-hosted News
            limit: 5
            feeds:
              - url: https://selfh.st/feed.xml
                title: selfh.st

  # ===========================================================================
  # PAGE 3 — INFRA
  # Network (Pi-hole · Cloudflared · Flaresolverr) + NAS + System
  # ===========================================================================
  - name: Infra
    columns:
      - size: small
        widgets:
          - type: bookmarks
            title: Infrastructure
            groups:
              - title: Network
                color: 190 75 55
                links:
                  - title: Pi-hole
                    url: http://${HOST_IP}/admin
                    icon: si:pihole
                  - title: Cloudflare Zero Trust
                    url: https://one.dash.cloudflare.com
                    icon: si:cloudflare
                  - title: Flaresolverr
                    url: http://${HOST_IP}:8191
                    icon: di:flaresolverr
                  - title: Speedtest Tracker
                    url: http://${HOST_IP}:8765
                    icon: si:speedtest

              - title: Containers
                color: 270 60 60
                links:
                  - title: Portainer (Server)
                    url: http://${HOST_IP}:9000
                    icon: si:portainer

              - title: NAS
                color: 145 70 55
                links:
                  - title: Synology DSM
                    url: http://${NAS_IP}:5000
                    icon: si:synology

          - type: dns-stats
            title: Pi-hole
            service: pihole-v6
            url: http://${HOST_IP}
            token: ${PIHOLE_API_TOKEN}

      - size: full
        widgets:
          - type: server-stats
            title: Server — System Stats
            servers:
              - type: local
                name: Server

          - type: server-stats
            title: Synology NAS — System Stats
            servers:
              - type: remote
                name: NAS
                url: http://${NAS_IP}:61209
                # username: ${GLANCES_NAS_USER}
                # password: ${GLANCES_NAS_PASS}

          - type: docker-containers
            title: Server — Docker Containers

      - size: small
        widgets:
          - type: clock
            title: Time
            hour-format: 24h

          - type: monitor
            title: Quick Health
            sites:
              - title: Pi-hole
                url: http://${HOST_IP}/admin
                icon: si:pihole
              - title: Portainer
                url: http://${HOST_IP}:9000
                icon: si:portainer
              - title: Synology DSM
                url: http://${NAS_IP}:5000
                icon: si:synology
              - title: Flaresolverr
                url: http://${HOST_IP}:8191
                icon: di:flaresolverr
              - title: Speedtest Tracker
                url: http://${HOST_IP}:8765
                icon: si:speedtest

  # ===========================================================================
  # PAGE 4 — HOME AUTOMATION
  # Home Assistant · Scrypted
  # ===========================================================================
  - name: Home
    columns:
      - size: small
        widgets:
          - type: bookmarks
            title: Home Automation
            groups:
              - title: Control
                color: 45 90 60
                links:
                  - title: Home Assistant
                    url: http://${HOST_IP}:8123
                    icon: si:homeassistant
                  - title: Scrypted
                    url: http://${HOST_IP}:10443
                    icon: di:scrypted

          - type: clock
            title: Local Time
            hour-format: 24h

          - type: weather
            title: Weather
            location: ${WEATHER_LOCATION}
            units: metric
            hour-format: 24h

      - size: full
        widgets:
          - type: iframe
            title: Home Assistant
            url: http://${HOST_IP}:8123
            height: 650

      - size: small
        widgets:
          - type: monitor
            title: Automation Health
            sites:
              - title: Home Assistant
                url: http://${HOST_IP}:8123
                icon: si:homeassistant
              - title: Scrypted
                url: http://${HOST_IP}:10443
                icon: di:scrypted
