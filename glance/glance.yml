server:
  port: 8090

theme:
  background-color: 240 27 11
  contrast-multiplier: 1.5
  primary-color: 321 100 71
  positive-color: 165 78 51
  negative-color: 360 100 71
  disable-picker: true

branding:
  logo-url: https://raw.githubusercontent.com/fstevens30/glance-dashboard-config/main/glance/logo.png
  favicon-url: https://raw.githubusercontent.com/fstevens30/glance-dashboard-config/main/glance/logo.png
  app-name: "Glance"
  app-icon-url: https://raw.githubusercontent.com/fstevens30/glance-dashboard-config/main/glance/logo.png
  app-background-color: "#151519"
  hide-footer: true

pages:
  - name: Home
    width: wide
    hide-desktop-navigation: true
    columns:
      # Sidebar, these are externally accessible links that I use frequently.
      - size: small
        widgets:
          - type: bookmarks
            title: Bookmarks
            hide-header: true
            groups:
              - title: Productivity
                bookmarks:
                  - title: Gmail
                    url: https://mail.google.com/mail/u/0/#inbox
                    icon: sh:gmail
                  - title: iCloud
                    url: https://www.icloud.com/
                    icon: sh:icloud
                  - title: Budget
                    url: https://budget.flynnstevens.dev
                    icon: sh:actual-budget
                  - title: ASB
                    url: https://online.asb.co.nz
                    icon: sh:asb
                  - title: ChatGPT
                    url: https://chat.openai.com/
                    icon: sh:chatgpt
                  - title: GitHub
                    url: https://github.com/
                    icon: sh:github

              - title: Personal
                bookmarks:
                  - title: Youtube
                    url: https://www.youtube.com/
                    icon: sh:youtube
                  - title: Facebook
                    url: https://www.facebook.com/
                    icon: sh:facebook
                  - title: Twitter
                    url: https://twitter.com/home
                    icon: sh:twitter
                  - title: Reddit
                    url: https://www.reddit.com/
                    icon: sh:reddit
                  - title: BlueSky
                    url: https://bsky.app/
                    icon: sh:bluesky

              - title: Media
                bookmarks:
                  - title: Jellyfin
                    url: https://jellyfin.flynnstevens.dev/
                    icon: sh:jellyfin
                  - title: Movies
                    url: https://radarr.flynnstevens.dev/
                    icon: sh:radarr
                  - title: Shows
                    url: https://sonarr.flynnstevens.dev/
                    icon: sh:sonarr
                  - title: Torrents
                    url: https://torrent.flynnstevens.dev/
                    icon: sh:qbittorrent
                  - title: Requests
                    url: https://jellyseerr.flynnstevens.dev/
                    icon: sh:jellyseerr
                  - title: Stats
                    url: https://jellystat.flynnstevens.dev/
                    icon: sh:jellystat

      # Main content.
      - size: full
        widgets:
          - type: search
            title: Search
            search-engine: google
            hide-header: true

          - type: group
            title: News
            hide-header: true
            widgets:
              - type: rss
                title: World News
                feeds:
                  - url: https://www.rnz.co.nz/rss/world.xml
                    title: RNZ World Headlines
                  - url: https://feeds.bbci.co.uk/news/world/rss.xml
                    title: BBC World News
              - type: rss
                title: Local News
                feeds:
                  - url: https://news.google.com/rss/search?q=Christchurch+Canterbury+New+Zealand&hl=en-NZ&gl=NZ&ceid=NZ%3Aen
                    title: Google News Christchurch
                  - url: https://www.rnz.co.nz/rss/national.xml
                    title: RNZ National News
                  - url: https://www.rnz.co.nz/rss/ldr.xml
                    title: RNZ Local Democracy Reporting

              - type: rss
                title: Technology
                feeds:
                  - url: https://news.ycombinator.com/rss
                    title: Hacker News
                  - url: https://feeds.arstechnica.com/arstechnica/index
                    title: Ars Technica
                  - url: https://www.theverge.com/rss/index.xml
                    title: The Verge
                  - url: https://lobste.rs/rss
                    title: Lobsters

              - type: rss
                title: Local Sports
                feeds:
                  - url: https://www.rnz.co.nz/rss/sport.xml
                    title: RNZ Sport
                  - url: https://www.rnz.co.nz/rss/live-sport.xml
                    title: RNZ Live Sport

              - type: rss
                title: Football
                feeds:
                  - url: https://feeds.bbci.co.uk/sport/football/rss.xml
                    title: BBC Football
                  - url: https://www.theguardian.com/football/rss
                    title: The Guardian Football
                  - url: https://news.google.com/rss/search?q=%22New+Zealand+football%22+OR+%22All+Whites%22+OR+%22Wellington+Phoenix%22+OR+%22Auckland+FC%22&hl=en-NZ&gl=NZ&ceid=NZ%3Aen
                    title: NZ Football News

      - size: small
        widgets:
          - type: clock
            title: Christchurch
            hour-format: 24h

          - type: weather
            title: Weather
            location: ${WEATHER_LOCATION}
            units: metric
            hour-format: 24h

          - type: group
            widgets:
              - type: custom-api
                title: Month
                body-type: string
                skip-json-validation: true
                cache: 1s
                template: |
                  {{ $localTime := now }}

                  {{ $month := $localTime.Month }}
                  {{ $dayOfMonth := $localTime.Day }}
                  {{ $year := $localTime.Year }}

                  {{ $secondsToday := add (mul $localTime.Hour 3600) (mul $localTime.Minute 60) | add $localTime.Second }}
                  {{ $fractionOfDay := div $secondsToday 86400.0 }}

                  {{ $daysInMonth := 31 }}
                  {{ if eq $month 2 }}
                    {{ $isLeapYear := or (eq (mod $year 400) 0) (and (eq (mod $year 4) 0) (ne (mod $year 100) 0)) }}
                    {{ $daysInMonth = 28 }}
                    {{ if $isLeapYear }}{{ $daysInMonth = 29 }}{{ end }}
                  {{ else if or (eq $month 4) (eq $month 6) (eq $month 9) (eq $month 11) }}
                    {{ $daysInMonth = 30 }}
                  {{ end }}

                  {{ $daysElapsed := add (sub $dayOfMonth 1) $fractionOfDay }}
                  {{ $monthProgress := mul (div $daysElapsed $daysInMonth) 100.0 }}

                  {{ $gradient := "" }}
                  {{ if lt $monthProgress 10.0 }}
                    {{ $gradient = "#FF4BA2" }}
                  {{ else if lt $monthProgress 25.0 }}
                    {{ $gradient = "#FFE100, #FF4BA2" }}
                  {{ else if lt $monthProgress 50.0 }}
                    {{ $gradient = "#FFE100, #FF7600, #FF4400" }}
                  {{ else }}
                    {{ $gradient = "#FFE100, #FF7600, #FF4400, #FF4BA2" }}
                  {{ end }}

                  <div style="font-family: sans-serif; text-align: center;">
                    <div style="width: 100%; height: 12px; background: #23262F; border:1px solid gray; border-radius: 10px; overflow: hidden;">
                      <div style="
                        height: 100%;
                        width: {{ $monthProgress }}%;
                        background: linear-gradient(90deg, {{ $gradient }});
                      "></div>
                    </div>
                    <div class="size-h1" style="margin-top: 6px;">{{ printf "%.2f" $monthProgress }}% of the month has passed</div>
                  </div>

              - type: custom-api
                title: Year
                body-type: string
                skip-json-validation: true
                cache: 1s
                template: |
                  {{ $localTime := now }}

                  {{ $secondsToday := add (mul $localTime.Hour 3600) (mul $localTime.Minute 60) | add $localTime.Second }}
                  {{ $dayOfYear := $localTime.YearDay }}
                  {{ $secondsElapsed := add (mul (sub $dayOfYear 1) 86400) $secondsToday }}

                  {{ $year := $localTime.Year }}
                  {{ $isLeapYear := or (eq (mod $year 400) 0) (and (eq (mod $year 4) 0) (ne (mod $year 100) 0)) }}
                  {{ $totalDaysInYear := 365 }}
                  {{ if $isLeapYear }}{{ $totalDaysInYear = 366 }}{{ end }}
                  {{ $totalSecondsInYear := mul $totalDaysInYear 86400 }}
                  {{ $yearProgress := div (mul $secondsElapsed 100.0) $totalSecondsInYear }}

                  {{ $gradient := "" }}
                  {{ if lt $yearProgress 10.0 }}
                    {{ $gradient = "#FF4BA2" }}
                  {{ else if lt $yearProgress 25.0 }}
                    {{ $gradient = "#FFE100, #FF4BA2" }}
                  {{ else if lt $yearProgress 50.0 }}
                    {{ $gradient = "#FFE100, #FF7600, #FF4400" }}
                  {{ else }}
                    {{ $gradient = "#FFE100, #FF7600, #FF4400, #FF4BA2" }}
                  {{ end }}

                  <div style="font-family: sans-serif; text-align: center;">
                    <div style="width: 100%; height: 12px; background: #23262F; border:1px solid gray; border-radius: 10px; overflow: hidden;">
                      <div style="
                        height: 100%;
                        width: {{ $yearProgress }}%;
                        background: linear-gradient(90deg, {{ $gradient }});
                      "></div>
                    </div>
                    <div class="size-h1" style="margin-top: 6px;">{{ printf "%.2f" $yearProgress }}% of the year has passed</div>
                  </div>

          - type: calendar

          - type: custom-api
            cache: 1h
            title: Internet Speed
            title-url: http://${HOST_IP}:8765
            url: http://${HOST_IP}:8765/api/v1/results/latest
            headers:
              Authorization: Bearer ${SPEEDTEST_TRACKER_API_TOKEN}
              Accept: application/json
            subrequests:
              stats:
                url: http://${HOST_IP}:8765/api/v1/stats
                headers:
                  Authorization: Bearer ${SPEEDTEST_TRACKER_API_TOKEN}
                  Accept: application/json
            options:
              showPercentageDiff: true
            template: |
              {{ $showPercentage := .Options.BoolOr "showPercentageDiff" true }}

              {{ $stats := .Subrequest "stats" }}
              <div class="flex justify-between text-center margin-block-3">
              <div>
                  {{ $downloadChange := percentChange (.JSON.Float "data.download_bits") ($stats.JSON.Float "data.download.avg_bits")
                  }}
                  {{ if $showPercentage }}
                  <div
                  class="size-small {{ if gt $downloadChange 0.0 }}color-positive{{ else if lt $downloadChange 0.0 }}color-negative{{ else }}color-primary{{ end }}"
                  style="display: inline-flex; align-items: center;">
                  {{ $downloadChange | printf "%+.1f%%" }}
                  {{ if gt $downloadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ else if lt $downloadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ end }}
                  </div>
                  {{ end }}
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.download_bits" | mul 0.000001 | printf "%.1f" }}</div>
                  <div class="size-h6">DOWNLOAD</div>
              </div>
              <div>
                  {{ $uploadChange := percentChange (.JSON.Float "data.upload_bits") ($stats.JSON.Float "data.upload.avg_bits") }}
                  {{ if $showPercentage }}
                  <div
                  class="size-small {{ if gt $uploadChange 0.0 }}color-positive{{ else if lt $uploadChange 0.0 }}color-negative{{ else }}color-primary{{ end }}"
                  style="display: inline-flex; align-items: center;">
                  {{ $uploadChange | printf "%+.1f%%" }}
                  {{ if gt $uploadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ else if lt $uploadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ end }}
                  </div>
                  {{ end }}
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.upload_bits" | mul 0.000001 | printf "%.1f" }}</div>
                  <div class="size-h6">UPLOAD</div>
              </div>
              <div>
                  {{ $pingChange := percentChange (.JSON.Float "data.ping") ($stats.JSON.Float "data.ping.avg") }}
                  {{ if $showPercentage }}
                  <div
                  class="size-small {{ if gt $pingChange 0.0 }}color-negative{{ else if lt $pingChange 0.0 }}color-positive{{ else }}color-primary{{ end }}"
                  style="display: inline-flex; align-items: center;">
                  {{ $pingChange | printf "%+.1f%%" }}
                  {{ if lt $pingChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ else if gt $pingChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ end }}
                  </div>
                  {{ end }}
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.ping" | printf "%.0f ms" }}</div>
                  <div class="size-h6">PING</div>
              </div>
              </div>
