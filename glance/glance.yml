                    icon: sh:prowlarr
                  - title: qBittorrent
                    url: https://torrent.flynnstevens.dev
                    icon: sh:qbittorrent

              - title: Network & System
                color: 190 75 55
                links:
                  - title: Pi-hole
                    url: http://${HOST_IP}/admin
                    icon: sh:pi-hole
                  - title: Portainer
                    url: https://portainer.flynnstevens.dev
                    icon: sh:portainer
                  - title: Synology DSM
                    url: http://${NAS_IP}:5000
                    icon: sh:synology
                  - title: Cloudflare
                    url: https://dash.cloudflare.com
                    icon: sh:cloudflare
                  - title: Speedtest Tracker
                    url: https://https://speedtest-tracker.flynnstevens.dev
                    icon: sh:speedtest-tracker

              - title: Home
                color: 145 70 55
                links:
                  - title: Home Assistant
                    url: https://home.flynnstevens.dev
                    icon: si:homeassistant
                  - title: Scrypted
                    url: https://scrypted.flynnstevens.dev
                    icon: sh:scrypted
