server:
  port: 8090

theme:
  background-color: 0 0 16
  primary-color: 43 59 81
  positive-color: 61 66 44
  negative-color: 6 96 59

  disable-picker: false
  presets:
    tucan:
      background-color: 50 1 6
      primary-color: 24 97 58
      negative-color: 209 88 54

    shades-of-purple:
      background-color: 243 33 25
      contrast-multiplier: 1.2
      primary-color: 50 100 49
      positive-color: 98 82 71
      negative-color: 12 77 52

    neon-pink:
      background-color: 240 27 11
      contrast-multiplier: 1.5
      primary-color: 321 100 71
      positive-color: 165 78 51
      negative-color: 360 100 71

    peachy:
      light: true
      background-color: 28 40 77
      primary-color: 155 100 20
      negative-color: 0 100 60
      contrast-multiplier: 1.1
      text-saturation-multiplier: 0.5

branding:
  custom-footer: |
    <p>Powered by <a style="text-decoration: underline" href="https://github.com/glanceapp/glance">Glance</a> - <a style="text-decoration: underline" href="https://github.com/fstevens30/glance-dashboard-config">built</a> with ❤️ by <a style="text-decoration: underline" href="https://flynnstevens.dev">Flynn Stevens</a></p>
  logo-url: /assets/logo.png
  favicon-url: /assets/logo.png
  app-name: "Home"
  app-icon-url: "/assets/app-icon.png"
  app-background-color: "#151519"

pages:
  - name: Home
    slug: home
    columns:
      - size: small
        widgets:
          - type: clock
            title: Christchurch
            hour-format: 24h

          - type: weather
            title: Weather
            location: ${WEATHER_LOCATION}
            units: metric
            hour-format: 24h

          - type: group
            widgets:
              - type: custom-api
                title: Day
                body-type: string
                skip-json-validation: true
                cache: 1s
                template: |
                  {{ $localTime := now }}
                  {{ $secondsPerDay := 86400 }}
                  {{ $elapsedSeconds := add (mul $localTime.Hour 3600) (mul $localTime.Minute 60) | add $localTime.Second }}
                  {{ $dayProgress := div (mul $elapsedSeconds 100.0) $secondsPerDay }}

                  {{ $gradient := "" }}
                  {{ if lt $dayProgress 10.0 }}
                    {{ $gradient = "#FF4BA2" }}
                  {{ else if lt $dayProgress 25.0 }}
                    {{ $gradient = "#FFE100, #FF4BA2" }}
                  {{ else if lt $dayProgress 50.0 }}
                    {{ $gradient = "#FFE100, #FF7600, #FF4400" }}
                  {{ else }}
                    {{ $gradient = "#FFE100, #FF7600, #FF4400, #FF4BA2" }}
                  {{ end }}

                  <div style="font-family: sans-serif; text-align: center;">
                    <div style="width: 100%; height: 12px; background: #23262F; border:1px solid gray; border-radius: 10px; overflow: hidden;">
                      <div style="
                        height: 100%;
                        width: {{ $dayProgress }}%;
                        background: linear-gradient(90deg, {{ $gradient }});
                      "></div>
                    </div>
                    <div class="size-h1" style="margin-top: 6px;">{{ printf "%.2f" $dayProgress }}% of the day has passed</div>
                  </div>

              - type: custom-api
                title: Month
                body-type: string
                skip-json-validation: true
                cache: 1s
                template: |
                  {{ $localTime := now }}

                  {{ $month := $localTime.Month }}
                  {{ $dayOfMonth := $localTime.Day }}

                  {{ $secondsToday := add (mul $localTime.Hour 3600) (mul $localTime.Minute 60) | add $localTime.Second }}
                  {{ $fractionOfDay := div $secondsToday 86400.0 }}

                  {{ $daysInMonth := 31 }}
                  {{ if eq $month 2 }} {{ $daysInMonth = 28 }} {{ end }}
                  {{ if or (eq $month 4) (eq $month 6) (eq $month 9) (eq $month 11) }} {{ $daysInMonth = 30 }} {{ end }}

                  {{ $daysElapsed := add (sub $dayOfMonth 1) $fractionOfDay }}
                  {{ $monthProgress := mul (div $daysElapsed $daysInMonth) 100.0 }}

                  {{ $gradient := "" }}
                  {{ if lt $monthProgress 10.0 }}
                    {{ $gradient = "#FF4BA2" }}
                  {{ else if lt $monthProgress 25.0 }}
                    {{ $gradient = "#FFE100, #FF4BA2" }}
                  {{ else if lt $monthProgress 50.0 }}
                    {{ $gradient = "#FFE100, #FF7600, #FF4400" }}
                  {{ else }}
                    {{ $gradient = "#FFE100, #FF7600, #FF4400, #FF4BA2" }}
                  {{ end }}

                  <div style="font-family: sans-serif; text-align: center;">
                    <div style="width: 100%; height: 12px; background: #23262F; border:1px solid gray; border-radius: 10px; overflow: hidden;">
                      <div style="
                        height: 100%;
                        width: {{ $monthProgress }}%;
                        background: linear-gradient(90deg, {{ $gradient }});
                      "></div>
                    </div>
                    <div class="size-h1" style="margin-top: 6px;">{{ printf "%.2f" $monthProgress }}% of the month has passed</div>
                  </div>

              - type: custom-api
                title: Year
                body-type: string
                skip-json-validation: true
                cache: 1s
                template: |
                  {{ $localTime := now }}

                  {{ $secondsToday := add (mul $localTime.Hour 3600) (mul $localTime.Minute 60) | add $localTime.Second }}
                  {{ $dayOfYear := $localTime.YearDay }}
                  {{ $secondsElapsed := add (mul (sub $dayOfYear 1) 86400) $secondsToday }}

                  {{ $totalSecondsInYear := mul 365 86400 }}
                  {{ $yearProgress := div (mul $secondsElapsed 100.0) $totalSecondsInYear }}

                  {{ $gradient := "" }}
                  {{ if lt $yearProgress 10.0 }}
                    {{ $gradient = "#FF4BA2" }}
                  {{ else if lt $yearProgress 25.0 }}
                    {{ $gradient = "#FFE100, #FF4BA2" }}
                  {{ else if lt $yearProgress 50.0 }}
                    {{ $gradient = "#FFE100, #FF7600, #FF4400" }}
                  {{ else }}
                    {{ $gradient = "#FFE100, #FF7600, #FF4400, #FF4BA2" }}
                  {{ end }}

                  <div style="font-family: sans-serif; text-align: center;">
                    <div style="width: 100%; height: 12px; background: #23262F; border:1px solid gray; border-radius: 10px; overflow: hidden;">
                      <div style="
                        height: 100%;
                        width: {{ $yearProgress }}%;
                        background: linear-gradient(90deg, {{ $gradient }});
                      "></div>
                    </div>
                    <div class="size-h1" style="margin-top: 6px;">{{ printf "%.2f" $yearProgress }}% of the year has passed</div>
                  </div>

          - type: calendar

      - size: full
        widgets:
          - type: custom-api
            title: Astronomy Picture of the Day
            cache: 1d
            url: https://api.nasa.gov/planetary/apod?api_key=${NASA_API_KEY}
            headers:
              Accept: application/json
            template: |
              {{- if eq (.JSON.String "media_type") "image" -}}
                <div style="display:flex; flex-direction:column; align-items:center; width:100%; padding:8px; box-sizing:border-box;">
                  <!-- Clickable title -->
                  <p class="color-primary" style="margin:0 0 8px; text-align:center;">
                    <a 
                      href="https://apod.nasa.gov/apod/astropix.html" 
                      target="_blank" 
                      rel="noopener noreferrer"
                      style="color: inherit; text-decoration: none;"
                    >
                      {{ .JSON.String "title" }}
                    </a>
                  </p>

                  <!-- Image -->
                  <img
                    src="{{ .JSON.String "url" }}"
                    alt="{{ .JSON.String "title" }}"
                    style="max-width:100%; height:auto; display:block; border-radius:4px;"
                  />

                  <!-- Explanation dropdown -->
                  <details style="width:100%; margin-top:12px;">
                    <summary class="color-highlight size-h5" style="cursor:pointer;">
                      Show Explanation
                    </summary>
                    <p class="color-highlight size-h5" style="margin-top:8px; text-align:left; line-height:1.4;">
                      {{ .JSON.String "explanation" }}
                    </p>
                  </details>
                </div>
              {{- else -}}
                <p class="color-negative" style="text-align:center;">
                  No image available today.
                </p>
              {{- end }}

          - type: monitor
            title: Service Health
            sites:
              - title: Jellyfin
                url: https://jellyfin.flynnstevens.dev
                icon: sh:jellyfin
              - title: Jellyseerr
                url: https://jellyseerr.flynnstevens.dev
                icon: sh:jellyseerr
              - title: Radarr
                url: https://radarr.flynnstevens.dev
                icon: sh:radarr
              - title: Sonarr
                url: https://sonarr.flynnstevens.dev
                icon: sh:sonarr
              - title: Prowlarr
                url: https://prowlarr.flynnstevens.dev
                icon: sh:prowlarr
              - title: qBittorrent
                url: https://torrent.flynnstevens.dev
                icon: sh:qbittorrent
              - title: Pi-hole
                url: http://${HOST_IP}/admin
                icon: sh:pi-hole
              - title: Flaresolverr
                url: http://${HOST_IP}:8191
                icon: sh:flaresolverr
              - title: Portainer
                url: https://portainer.flynnstevens.dev
                icon: sh:portainer
              - title: Home Assistant
                url: https://home.flynnstevens.dev
                icon: sh:home-assistant
              - title: Scrypted
                url: https://scrypted.flynnstevens.dev
                icon: mdi:cctv
              - title: Synology DSM
                url: http://${NAS_IP}:5000
                icon: sh:synology
              - title: Speedtest Tracker
                url: https://speedtest-tracker.flynnstevens.dev
                icon: sh:speedtest-tracker
              - title: Portfolio
                url: https://flynnstevens.dev
                icon: si:nextdotjs

      - size: small
        widgets:
          - type: custom-api
            title: Random Fact
            cache: 3h
            url: https://uselessfacts.jsph.pl/api/v2/facts/random
            template: |
              <p class="size-h4 color-paragraph">{{ .JSON.String "text" }}</p>

          - type: custom-api
            cache: 1h
            title: Internet Speed
            title-url: http://${HOST_IP}:8765
            url: http://${HOST_IP}:8765/api/v1/results/latest
            headers:
              Authorization: Bearer ${SPEEDTEST_TRACKER_API_TOKEN}
              Accept: application/json
            subrequests:
              stats:
                url: http://${HOST_IP}:8765/api/v1/stats
                headers:
                  Authorization: Bearer ${SPEEDTEST_TRACKER_API_TOKEN}
                  Accept: application/json
            options:
              showPercentageDiff: true
            template: |
              {{ $showPercentage := .Options.BoolOr "showPercentageDiff" true }}

              {{ $stats := .Subrequest "stats" }}
              <div class="flex justify-between text-center margin-block-3">
              <div>
                  {{ $downloadChange := percentChange (.JSON.Float "data.download_bits") ($stats.JSON.Float "data.download.avg_bits")
                  }}
                  {{ if $showPercentage }}
                  <div
                  class="size-small {{ if gt $downloadChange 0.0 }}color-positive{{ else if lt $downloadChange 0.0 }}color-negative{{ else }}color-primary{{ end }}"
                  style="display: inline-flex; align-items: center;">
                  {{ $downloadChange | printf "%+.1f%%" }}
                  {{ if gt $downloadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ else if lt $downloadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ end }}
                  </div>
                  {{ end }}
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.download_bits" | mul 0.000001 | printf "%.1f" }}</div>
                  <div class="size-h6">DOWNLOAD</div>
              </div>
              <div>
                  {{ $uploadChange := percentChange (.JSON.Float "data.upload_bits") ($stats.JSON.Float "data.upload.avg_bits") }}
                  {{ if $showPercentage }}
                  <div
                  class="size-small {{ if gt $uploadChange 0.0 }}color-positive{{ else if lt $uploadChange 0.0 }}color-negative{{ else }}color-primary{{ end }}"
                  style="display: inline-flex; align-items: center;">
                  {{ $uploadChange | printf "%+.1f%%" }}
                  {{ if gt $uploadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ else if lt $uploadChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ end }}
                  </div>
                  {{ end }}
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.upload_bits" | mul 0.000001 | printf "%.1f" }}</div>
                  <div class="size-h6">UPLOAD</div>
              </div>
              <div>
                  {{ $pingChange := percentChange (.JSON.Float "data.ping") ($stats.JSON.Float "data.ping.avg") }}
                  {{ if $showPercentage }}
                  <div
                  class="size-small {{ if gt $pingChange 0.0 }}color-negative{{ else if lt $pingChange 0.0 }}color-positive{{ else }}color-primary{{ end }}"
                  style="display: inline-flex; align-items: center;">
                  {{ $pingChange | printf "%+.1f%%" }}
                  {{ if lt $pingChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M1.22 4.22a.75.75 0 0 1 1.06 0L6 7.94l2.761-2.762a.75.75 0 0 1 1.158.12 24.9 24.9 0 0 1 2.718 5.556l.729-1.261a.75.75 0 0 1 1.299.75l-1.591 2.755a.75.75 0 0 1-1.025.275l-2.756-1.591a.75.75 0 1 1 .75-1.3l1.097.634a23.417 23.417 0 0 0-1.984-4.211L6.53 9.53a.75.75 0 0 1-1.06 0L1.22 5.28a.75.75 0 0 1 0-1.06Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ else if gt $pingChange 0.0 }}
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                      style="height: 1em; margin-left: 0.25em;" class="size-4">
                      <path fill-rule="evenodd"
                      d="M9.808 4.057a.75.75 0 0 1 .92-.527l3.116.849a.75.75 0 0 1 .528.915l-.823 3.121a.75.75 0 0 1-1.45-.382l.337-1.281a23.484 23.484 0 0 0-3.609 3.056.75.75 0 0 1-1.07.01L6 8.06l-3.72 3.72a.75.75 0 1 1-1.06-1.061l4.25-4.25a.75.75 0 0 1 1.06 0l1.756 1.755a25.015 25.015 0 0 1 3.508-2.85l-1.46-.398a.75.75 0 0 1-.526-.92Z"
                      clip-rule="evenodd" />
                  </svg>
                  {{ end }}
                  </div>
                  {{ end }}
                  <div class="color-highlight size-h3">{{ .JSON.Float "data.ping" | printf "%.0f ms" }}</div>
                  <div class="size-h6">PING</div>
              </div>
              </div>

          - type: bookmarks
            title: Quick Links
            groups:
              - title: Media
                color: 217 92 83
                links:
                  - title: Jellyfin
                    url: https://jellyfin.flynnstevens.dev
                    icon: sh:jellyfin
                  - title: Jellyseerr
                    url: https://jellyseerr.flynnstevens.dev
                    icon: sh:jellyseerr

              - title: Downloads
                color: 200 70 55
                links:
                  - title: Radarr
                    url: https://radarr.flynnstevens.dev
                    icon: sh:radarr
                  - title: Sonarr
                    url: https://sonarr.flynnstevens.dev
                    icon: sh:sonarr
                  - title: Prowlarr
                    url: https://prowlarr.flynnstevens.dev
                    icon: sh:prowlarr
                  - title: qBittorrent
                    url: https://torrent.flynnstevens.dev
                    icon: sh:qbittorrent

              - title: Network & System
                color: 190 75 55
                links:
                  - title: Pi-hole
                    url: http://${HOST_IP}/admin
                    icon: sh:pi-hole
                  - title: Portainer
                    url: https://portainer.flynnstevens.dev
                    icon: sh:portainer
                  - title: Synology DSM
                    url: http://${NAS_IP}:5000
                    icon: sh:synology
                  - title: Cloudflare
                    url: https://dash.cloudflare.com
                    icon: sh:cloudflare
                  - title: Speedtest Tracker
                    url: https://https://speedtest-tracker.flynnstevens.dev
                    icon: sh:speedtest-tracker

              - title: Home
                color: 145 70 55
                links:
                  - title: Home Assistant
                    url: https://home.flynnstevens.dev
                    icon: si:homeassistant
                  - title: Scrypted
                    url: https://scrypted.flynnstevens.dev
                    icon: mdi:cctv

  - $include: homelab.yml
  - $include: media.yml
  - $include: news.yml
  - $include: sports.yml
